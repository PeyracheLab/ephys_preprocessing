[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nwb-builder"
version = "0.1.0"
description = "Build NWB files from Intan/Neurosuite ephys + Optitrack sessions, readable back as pynapple objects."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pynwb>=2.5",
    "pynapple>=0.6",
]

[project.scripts]
nwb-build = "nwb_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
